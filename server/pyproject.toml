[project]
name = "qface-lsp-server"
version = "0.0.1"
description = "Language server for the QFace IDL"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pygls>=1.3.0",
    "qface",
]

[project.scripts]
qface-lsp-server = "qface_lsp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qface_lsp*"]
